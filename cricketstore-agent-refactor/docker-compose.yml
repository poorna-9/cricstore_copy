services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cricketstore_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: cricketstore_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --workers 3 --bind 0.0.0.0:8000
               --timeout 120
               --access-logfile -
               --error-logfile -
               cricketstore.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=cricketstore.settings
      - DEBUG=False
    restart: always

  celery-worker:
    build: .
    container_name: cricketstore_celery_worker
    command: celery -A cricketstore worker --loglevel=info --concurrency=2
    depends_on:
      - web
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=cricketstore.settings
      - DEBUG=False
    restart: always

  celery-beat:
    build: .
    container_name: cricketstore_celery_beat
    command: >
      celery -A cricketstore beat --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - web
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=cricketstore.settings
      - DEBUG=False
    restart: always

  kafka-consumer:
    build: .
    container_name: cricketstore_kafka_consumer
    command: python manage.py run_kafka_consumers --instances 1
    depends_on:
      - web
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=cricketstore.settings
      - DEBUG=False
    restart: always
  nginx:
    image: nginx:1.25-alpine
    container_name: cricketstore_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    restart: always

volumes:
  es_data:    
  static_volume: 