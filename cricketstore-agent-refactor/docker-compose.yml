services:
  db:
    image: postgres:15
    container_name: cricketstore_db
    restart: always
    environment:
      POSTGRES_DB: cricketstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: cricketstore_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always

  redis:
    image: redis:7
    container_name: cricketstore_redis
    restart: always
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: cricketstore_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  web:
    build: .
    container_name: cricketstore_web
    command: sh -c "python manage.py migrate && gunicorn --workers 1 --bind 0.0.0.0:8000 cricketstore.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - elasticsearch
      - redis
      - kafka
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=cricketstore.settings
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}

  kafka-consumer:
    build: .
    container_name: cricketstore_kafka_consumer
    command: sh -c "python manage.py run_kafka_consumers --instances 1"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - kafka
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=cricketstore.settings
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}

volumes:
  postgres_data:
  es_data:
  kafka_data:
